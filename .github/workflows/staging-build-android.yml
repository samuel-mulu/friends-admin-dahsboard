name: Staging Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API Base URL"
        required: true
        default: "https://apitesting.friendscheweta.com"
      socket_url:
        description: "Socket URL"
        required: true
        default: "https://apitesting.friendscheweta.com"
      release_tag:
        description: "Release Tag (leave blank for auto staging-v<version>)"
        required: false
        default: ""
      release_title:
        description: "Release Title (leave blank for auto)"
        required: false
        default: ""
      debug:
        description: "DEBUG flag (true/false)"
        required: true
        default: "false"
      realtime_debug:
        description: "REALTIME_DEBUG flag (true/false)"
        required: true
        default: "false"
      chain_debug:
        description: "CHAIN_DEBUG flag (true/false)"
        required: true
        default: "false"
      big_game_debug:
        description: "BIG_GAME_DEBUG flag (true/false)"
        required: true
        default: "false"
      telebirr_deposit_debug:
        description: "TELEBIRR_DEPOSIT_DEBUG flag (true/false)"
        required: true
        default: "false"
      create_github_release:
        description: "Save build directly into GitHub Releases"
        type: boolean
        required: false
        default: true

  push:
    branches:
      - staging

jobs:
  build:
    name: Staging Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure .env Asset File Exists
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.production.example ]; then
              echo "Creating .env from .env.production.example"
              cp .env.production.example .env
            else
              echo "Creating minimal fallback .env file"
              touch .env
            fi
          fi

      - name: Extract App Version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //g' | tr -d '\r\n ')
          CLEAN_VERSION=$(echo "$VERSION" | tr '+' '_')
          BASE_VERSION=$(echo "$VERSION" | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

      - name: Resolve Release Metadata
        id: release_meta
        run: |
          CUSTOM_TAG="${{ github.event.inputs.release_tag }}"
          CUSTOM_TITLE="${{ github.event.inputs.release_title }}"

          if [ -n "$CUSTOM_TAG" ]; then
            TAG_NAME="$CUSTOM_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="staging-v${{ steps.app_version.outputs.clean_version }}"
          fi

          if [ -n "$CUSTOM_TITLE" ]; then
            TITLE="$CUSTOM_TITLE"
          else
            TITLE="Friends Bingo Android (Staging) v${{ steps.app_version.outputs.version }}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${TITLE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag Name: ${TAG_NAME}"
          echo "Resolved Release Title: ${TITLE}"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://apitesting.friendscheweta.com' }}" \
            --dart-define=SOCKET_URL="${{ github.event.inputs.socket_url || 'https://apitesting.friendscheweta.com' }}" \
            --dart-define=DEBUG="${{ github.event.inputs.debug || 'false' }}" \
            --dart-define=REALTIME_DEBUG="${{ github.event.inputs.realtime_debug || 'false' }}" \
            --dart-define=CHAIN_DEBUG="${{ github.event.inputs.chain_debug || 'false' }}" \
            --dart-define=BIG_GAME_DEBUG="${{ github.event.inputs.big_game_debug || 'false' }}" \
            --dart-define=TELEBIRR_DEPOSIT_DEBUG="${{ github.event.inputs.telebirr_deposit_debug || 'false' }}"

      - name: Prepare APKs for Distribution
        run: |
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          SOURCE_APK="$OUTPUT_DIR/app-release.apk"
          CLEAN_VER="${{ steps.app_version.outputs.clean_version }}"
          NAMED_APK="$OUTPUT_DIR/friends-bingo-${CLEAN_VER}-staging.apk"
          DEFAULT_APK="$OUTPUT_DIR/Friends-Bingo-Staging.apk"

          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$NAMED_APK"
            cp "$SOURCE_APK" "$DEFAULT_APK"
            echo "Successfully prepared: $DEFAULT_APK and $NAMED_APK"
          else
            echo "ERROR: $SOURCE_APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friends-bingo-android-staging-v${{ steps.app_version.outputs.clean_version }}
          path: |
            build/app/outputs/flutter-apk/Friends-Bingo-Staging.apk
            build/app/outputs/flutter-apk/friends-bingo-*-staging.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Save to GitHub Releases
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.create_github_release || github.event.inputs.create_github_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          draft: false
          prerelease: true
          overwrite_files: true
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/Friends-Bingo-Staging.apk
            build/app/outputs/flutter-apk/friends-bingo-*-staging.apk
          body: |
            ### Friends Bingo Android Release (Staging Testing)
            - **Version**: `${{ steps.app_version.outputs.version }}`
            - **Tag**: `${{ steps.release_meta.outputs.tag_name }}`
            - **Commit**: `${{ github.sha }}`
            - **API Base URL**: `${{ github.event.inputs.api_base_url || 'https://apitesting.friendscheweta.com' }}`
            - **Socket URL**: `${{ github.event.inputs.socket_url || 'https://apitesting.friendscheweta.com' }}`

            Download **`Friends-Bingo-Staging.apk`** below to install directly on your Android phone.
